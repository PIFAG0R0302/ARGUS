# SignPath Foundation GitHub Actions Workflow for ARGUS
# Copy this file to `.github/workflows/release-signpath.yml` (via GitHub Web UI or after `gh auth refresh -s workflow`)
# and configure repository secrets:
#   - SIGNPATH_ORGANIZATION_ID
#   - SIGNPATH_API_TOKEN
#   - UPDATES_REPO_TOKEN (optional PAT with contents:write on PIFAG0R0302/ARGUS-Updates)

name: ARGUS SignPath Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.3)"
        required: true

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Strict Build & Unit Tests
        shell: pwsh
        run: |
          .\build.ps1 -Configuration Release -Strict -Test

      - name: Publish self-contained win-x64 Argus.exe
        shell: pwsh
        run: |
          dotnet publish src\Argus.App\Argus.App.csproj -c Release -r win-x64 --self-contained true `
            -p:ArgusRequireAdmin=false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:TreatWarningsAsErrors=true `
            -o publish\release-stage

      - name: Submit Argus.exe to SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: argus
          signing-policy-slug: release-signing
          input-artifact-path: publish\release-stage\Argus.exe
          wait-for-completion: true
          output-artifact-path: publish\release-stage\Argus.exe

      - name: Compile Inno Setup 6 Installer
        shell: pwsh
        run: |
          Copy-Item rules publish\release-stage\rules -Recurse -Force
          Copy-Item docs\USER-GUIDE.md publish\release-stage\USER-GUIDE.md -Force
          iscc "/DMyAppVersion=${{ inputs.version }}" "/DPayloadDir=publish\release-stage" "/DOutputDirPath=ArgusSetup" installer\Argus.iss

      - name: Submit Installer to SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: argus
          signing-policy-slug: release-signing
          input-artifact-path: ArgusSetup\Argus-Setup-${{ inputs.version }}-win-x64.exe
          wait-for-completion: true
          output-artifact-path: ArgusSetup\Argus-Setup-${{ inputs.version }}-win-x64.exe

      - name: Package Portable ZIP & SHA256SUMS
        shell: pwsh
        run: |
          Compress-Archive -Path publish\release-stage\* -DestinationPath "ArgusSetup\Argus-Portable-${{ inputs.version }}-win-x64.zip" -CompressionLevel Optimal -Force
          $h1 = (Get-FileHash "ArgusSetup\Argus-Setup-${{ inputs.version }}-win-x64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $h2 = (Get-FileHash "ArgusSetup\Argus-Portable-${{ inputs.version }}-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(
            "$h1  Argus-Setup-${{ inputs.version }}-win-x64.exe",
            "$h2  Argus-Portable-${{ inputs.version }}-win-x64.zip"
          )
          [System.IO.File]::WriteAllLines("ArgusSetup\SHA256SUMS.txt", $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-signed-${{ inputs.version }}
          path: ArgusSetup\
